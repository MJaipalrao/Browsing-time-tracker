<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browsing Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-body">
    <main class="popup">
      <header class="popup-header">
        <span class="brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </span>
        <h1>Browsing Time Tracker</h1>
        <button id="settingsBtn" class="icon-button" title="Open dashboard" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </header>

      <section class="panel compact">
        <div class="popup-month-row">
          <select id="monthSelect" class="select"></select>
        </div>

        <div class="stat hero-stat">
          <span>Total Time</span>
          <strong id="totalTime">0s</strong>
          <div id="totalTimeDelta" class="stat-delta"></div>
        </div>

        <div class="mini-grid">
          <div class="stat">
            <span>Links Visited</span>
            <strong id="linksVisited">0</strong>
            <div id="linksDelta" class="stat-delta"></div>
          </div>
          <div class="stat">
            <span>Domains</span>
            <strong id="domainsVisited">0</strong>
            <div id="domainsDelta" class="stat-delta"></div>
          </div>
        </div>

        <div class="popup-top-sites" id="popupTopSites"></div>

        <button id="openDashboard" class="primary-button">Open Dashboard</button>
      </section>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
